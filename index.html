<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI ナンプレ自動解答</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #0f172a; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    header {
      width: 100%; background: #1e293b; padding: 12px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .cam-btn {
      background: #10b981; color: white; padding: 12px 24px; border-radius: 10px;
      font-weight: bold; font-size: 16px; cursor: pointer; display: inline-block;
      box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
    }
    #status { font-size: 13px; margin-top: 8px; color: #cbd5e1; min-height: 18px; }
    .board {
      display: grid; grid-template-columns: repeat(9, 1fr);
      width: min(94vw, 420px); height: min(94vw, 420px);
      margin: 16px auto; background: #000; border: 3px solid #334155;
    }
    .cell {
      width: 100%; height: 100%; border: 1px solid #cbd5e1;
      text-align: center; font-size: clamp(18px, 5vw, 26px); font-weight: bold;
      background: #ffffff; color: #0f172a; padding: 0; border-radius: 0;
      -webkit-appearance: none;
    }
    .cell.given { color: #0f172a; background: #f1f5f9; }
    .cell.solved { color: #2563eb; background: #ffffff; }
    .cell:nth-child(3n) { border-right: 2.5px solid #1e293b; }
    .cell:nth-child(9n) { border-right: 1px solid #cbd5e1; }
    .row-border { border-bottom: 2.5px solid #1e293b !important; }
    .controls { display: flex; gap: 12px; width: min(94vw, 420px); margin-bottom: 24px; }
    button.action-btn {
      flex: 1; padding: 14px; font-size: 16px; font-weight: bold;
      border: none; border-radius: 10px; cursor: pointer; color: white;
    }
    #solve-btn { background: #3b82f6; }
    #clear-btn { background: #64748b; }
  </style>
</head>
<body>
  <header>
    <label for="camera-input" class="cam-btn">📷 写メから読み取って自動解答</label>
    <input id="camera-input" type="file" accept="image/*" style="display:none;" />
    <div id="status">ナンプレの写真を撮影するか、直接数字を入力してください</div>
  </header>
  <div class="board" id="board"></div>
  <div class="controls">
    <button id="solve-btn" class="action-btn">解答する (Solve)</button>
    <button id="clear-btn" class="action-btn">クリア</button>
  </div>
  <script>
    const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"; const API_KEY = "AQ.Ab8RN6LYxkEXX5QEy" + "a-M3IvaC04APyme_Osp86PSkCpZEevbKQ";
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const inputs = [];

    for (let i = 0; i < 81; i++) {
      const inp = document.createElement('input');
      inp.type = 'tel'; inp.maxLength = 1; inp.className = 'cell';
      const r = Math.floor(i / 9);
      if (r === 2 || r === 5) inp.classList.add('row-border');
      inp.addEventListener('input', (e) => {
        const v = e.target.value.replace(/[^1-9]/g, '');
        e.target.value = v;
        e.target.className = 'cell' + (r === 2 || r === 5 ? ' row-border' : '') + (v ? ' given' : '');
      });
      boardEl.appendChild(inp);
      inputs.push(inp);
    }

    function setBoard(str) {
      for (let i = 0; i < 81; i++) {
        const ch = str[i];
        const r = Math.floor(i / 9);
        const baseClass = 'cell' + (r === 2 || r === 5 ? ' row-border' : '');
        if (ch >= '1' && ch <= '9') {
          inputs[i].value = ch; inputs[i].className = baseClass + ' given';
        } else {
          inputs[i].value = ''; inputs[i].className = baseClass;
        }
      }
    }

    function solveSudoku() {
      const grid = inputs.map(inp => parseInt(inp.value) || 0);
      const isGiven = grid.map(v => v !== 0);
      for (let i = 0; i < 81; i++) {
        if (grid[i] !== 0) {
          const val = grid[i]; grid[i] = 0;
          if (!isValid(grid, Math.floor(i / 9), i % 9, val)) {
            grid[i] = val;
            statusEl.textContent = "エラー: 数字が重複しているため解けません（読み取りミスを修正してください）";
            statusEl.style.color = "#f87171";
            return;
          }
          grid[i] = val;
        }
      }
      if (solve(grid)) {
        for (let i = 0; i < 81; i++) {
          const r = Math.floor(i / 9);
          const baseClass = 'cell' + (r === 2 || r === 5 ? ' row-border' : '');
          inputs[i].value = grid[i];
          inputs[i].className = baseClass + (isGiven[i] ? ' given' : ' solved');
        }
        statusEl.textContent = "解答完了！（青字が自動で埋めた数字です）";
        statusEl.style.color = "#4ade80";
      } else {
        statusEl.textContent = "解が見つかりませんでした（数字を確認してください）";
        statusEl.style.color = "#f87171";
      }
    }

    function isValid(grid, r, c, num) {
      for (let i = 0; i < 9; i++) {
        if (grid[r * 9 + i] === num || grid[i * 9 + c] === num) return false;
      }
      const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
      for (let dr = 0; dr < 3; dr++) {
        for (let dc = 0; dc < 3; dc++) {
          if (grid[(br + dr) * 9 + (bc + dc)] === num) return false;
        }
      }
      return true;
    }

    function solve(grid) {
      for (let i = 0; i < 81; i++) {
        if (grid[i] === 0) {
          const r = Math.floor(i / 9), c = i % 9;
          for (let num = 1; num <= 9; num++) {
            if (isValid(grid, r, c, num)) {
              grid[i] = num;
              if (solve(grid)) return true;
              grid[i] = 0;
            }
          }
          return false;
        }
      }
      return true;
    }

    document.getElementById('solve-btn').addEventListener('click', solveSudoku);
    document.getElementById('clear-btn').addEventListener('click', () => {
      setBoard("0".repeat(81));
      statusEl.textContent = "盤面をクリアしました";
      statusEl.style.color = "#cbd5e1";
    });

    document.getElementById('camera-input').addEventListener('change', async function(e) {
      const file = e.target.files.item(0);
      if (!file) return;
      statusEl.textContent = "AIが画像を解析中...（5〜10秒ほどお待ちください）";
      statusEl.style.color = "#38bdf8";

      try {
        const base64Data = await compressImage(file);
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "この画像にある9x9の数独（ナンプレ）の盤面を読み取り、左上から右下へ1行ずつ順番に81文字の数字列だけで出力してください。空白マスは0にしてください。説明や改行は一切不要で、81桁の数字のみを返してください。" },
                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
              ]
            }]
          })
        });
        const data = await res.json();
        const raw = JSON.stringify(data);
        const match = raw.match(/"text"\s*:\s*"([^"]+)"/);
        const digits = (match ? match.at(1) : "").replace(/[^0-9]/g, "");
        if (digits.length === 81) {
          setBoard(digits);
          solveSudoku();
        } else {
          statusEl.textContent = "読み取り失敗: " + (data.error ? data.error.message : "盤面全体が写るように再撮影してください");
          statusEl.style.color = "#f87171";
        }
      } catch (err) {
        statusEl.textContent = "通信エラー: " + err.message;
        statusEl.style.color = "#f87171";
      }
      e.target.value = "";
    });

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            const c = document.createElement('canvas');
            const maxDim = 1024;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', 0.85).split(',').at(1));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
