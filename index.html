<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI ナンプレ自動解答</title>
  <style>
    body { margin: 0; padding: 0; background: #1e293b; overflow: hidden; font-family: sans-serif; }
    #ocr-bar {
      position: fixed; top: 0; left: 0; width: 100%; height: 74px;
      background: #1e293b; color: white; padding: 8px; box-sizing: border-box;
      text-align: center; z-index: 9999; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #unity-container {
      position: fixed; top: 74px; left: 0; width: 100%; height: calc(100% - 74px);
      background: #231F20; display: flex; justify-content: center; align-items: center;
    }
    #unity-canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="ocr-bar">
    <label for="camera-input" style="background:#10b981; color:white; padding:8px 18px; border-radius:8px; font-weight:bold; font-size:15px; cursor:pointer; display:inline-block;">
      📷 写メから読み取って自動解答
    </label>
    <input id="camera-input" type="file" accept="image/*" style="display:none;" />
    <div id="ocr-status" style="font-size:12px; margin-top:4px; color:#cbd5e1;">ナンプレの写真を撮影または選択してください</div>
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>

  <script src="Build/web.loader.js?v=1795707978"></script>
  <script>
    let globalUnityInstance = null;
    const canvas = document.querySelector("#unity-canvas");
    const config = {
      dataUrl: "Build/web.data?v=1795707978",
      frameworkUrl: "Build/web.framework.js?v=1795707978",
      codeUrl: "Build/web.wasm?v=1795707978",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "SUDOKU",
      productVersion: "1.0",
    };

    createUnityInstance(canvas, config, (progress) => {
      const statusEl = document.getElementById('ocr-status');
      if (progress < 1) {
        statusEl.textContent = "アプリ読み込み中... " + Math.round(progress * 100) + "%";
      } else {
        statusEl.textContent = "ナンプレの写真を撮影または選択してください";
      }
    }).then((instance) => {
      globalUnityInstance = instance;
    }).catch((message) => {
      document.getElementById('ocr-status').textContent = "起動エラー: " + message;
    });

    document.getElementById('camera-input').addEventListener('change', async function(e) {
      const file = e.target.files.item(0);
      if (!file) return;
      const statusEl = document.getElementById('ocr-status');
      statusEl.textContent = "AIが画像を解析中...（5〜10秒ほどお待ちください）";
      statusEl.style.color = "#38bdf8";

      try {
        const base64Data = await compressImage(file);
        const workerUrl = "https://" + "sudoku-unity.tats111469.workers.dev";
        const res = await fetch(workerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64: base64Data, mimeType: "image/jpeg" })
        });
        const data = await res.json();
        if (data.board && data.board.length === 81) {
          statusEl.textContent = "読み取り成功！(" + data.board.slice(0,9) + "...)";
          statusEl.style.color = "#4ade80";
          if (globalUnityInstance) {
            globalUnityInstance.SendMessage("BoardPanel", "SetBoardFromWeb", data.board);
          }
        } else {
          statusEl.textContent = "読み取り失敗: " + JSON.stringify(data);
          statusEl.style.color = "#f87171";
        }
      } catch (err) {
        statusEl.textContent = "通信エラー: " + err.message;
        statusEl.style.color = "#f87171";
      }
      e.target.value = "";
    });

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            const c = document.createElement('canvas');
            const maxDim = 1024;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            c.width = w;
            c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = c.toDataURL('image/jpeg', 0.85);
            resolve(dataUrl.split(',').at(1));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
